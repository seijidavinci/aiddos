# Nginx Reverse Proxy Configuration for AI-Driven DDoS SDN Framework
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Backend API
    upstream ddos_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Upstream React Dashboard UI
    upstream ddos_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # Frontend Dashboard
        location / {
            proxy_pass http://ddos_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://ddos_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://ddos_backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://ddos_backend/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
